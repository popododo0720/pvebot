{{define "accounts"}}
{{template "head" .}}
<h1>Accounts</h1>
<p>Paste a Claude setup token, a Codex auth.json, or an API key. The orchestrator stores it encrypted and injects it into the bot Secret.</p>
<ul>
{{range .Accounts}}<li>{{.Name}} <span>{{.Kind}}</span></li>{{end}}
</ul>
<form method="post" action="/accounts">
<label>Name <input name="name" required pattern="[a-z]([-a-z0-9]*[a-z0-9])?" maxlength="40"></label>
<label>Kind
<select name="kind">
<option value="claude">claude</option>
<option value="codex">codex</option>
<option value="apikey">apikey</option>
</select>
</label>
<label>Secret <textarea name="secret" rows="8" required></textarea></label>
<button type="submit">Save account</button>
</form>
{{template "foot" .}}
{{end}}

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the bot image
        run: docker build -t pvebot-bot:ci -f images/bot/Dockerfile .
      - name: Build the orchestrator image
        run: docker build -t pvebot-orchestrator:ci -f images/orchestrator/Dockerfile .

  integration:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Kind, Cilium, and the two-bot test
        run: bash hack/kind-ci.sh

  integration-native:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Kind, Cilium native routing, and the two-bot test
        run: ROUTING_MODE=native bash hack/kind-ci.sh
